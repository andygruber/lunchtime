[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lunchtime"
version = "0.1.0"
description = "Collects daily lunch menus from restaurant websites and shows what's for lunch today"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "plugins*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "translations/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
