privacy:
  title: Datenschutzerklärung
  sections:
    - heading: Verantwortlicher
      text: "{owner}, {address}, {email}"
    - heading: Cookie
      text: "Diese Website setzt ein einziges Cookie namens „lunchtime“. Es enthält ausschließlich deine Favoriten, deine Sprachwahl, deine Anzeige-Einstellungen (Farbschema, Favoriten oder alle Restaurants, Sortierung, Filter für vegetarische/vegane Gerichte) und ob du den Cookie-Hinweis bestätigt hast. Das Cookie ist für die von dir gewünschte Funktion technisch erforderlich (§ 165 Abs. 3 TKG 2021), wird nicht für Tracking verwendet und nicht an Dritte weitergegeben. Es wird nach 400 Tagen gelöscht oder sobald du die Cookies deines Browsers löschst."
    - heading: Standort
      text: "Wenn du „In der Nähe“ wählst, fragt dein Browser nach deinem Standort. Die Entfernungen werden ausschließlich in deinem Browser berechnet; der Standort wird nicht an den Server übertragen. Damit er nicht bei jedem Seitenwechsel neu ermittelt werden muss, wird er gerundet (auf ca. 100 m) im Sitzungsspeicher (sessionStorage) des Browsers abgelegt und beim Schließen des Tabs gelöscht."
    - heading: Keine Konten, kein Tracking
      text: Es gibt keine Benutzerkonten, keine Analyse- oder Werbedienste und keine eingebundenen Inhalte von Drittanbietern (z. B. Schriftarten oder Skripte). Auf dem Server werden keine Daten zu deiner Auswahl gespeichert.
    - heading: Server-Logs und Hosting
      text: "Beim Aufruf der Website verarbeitet der Server technisch notwendige Verbindungsdaten (z. B. IP-Adresse, Zeitpunkt, aufgerufene Seite), um die Website auszuliefern und gegen Missbrauch zu schützen (Art. 6 Abs. 1 lit. f DSGVO). Der Datenverkehr wird über Cloudflare (Cloudflare, Inc., USA) geleitet, das als Auftragsverarbeiter auftritt; die Übermittlung in die USA stützt sich auf das EU-US Data Privacy Framework. Hosting: {hosting}."
    - heading: Deine Rechte
      text: "Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch. Beschwerden kannst du bei der Österreichischen Datenschutzbehörde (www.dsb.gv.at) einbringen. Kontakt: {email}"

