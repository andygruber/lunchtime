# full wording of Annex II of Regulation (EU) No 1169/2011; letters as used in Austria
allergen_info:
  A: Glutenhaltiges Getreide (Weizen wie Dinkel und Khorasan-Weizen, Roggen, Gerste, Hafer oder Hybridstämme davon) und daraus hergestellte Erzeugnisse
  B: Krebstiere (z. B. Garnelen, Hummer, Krabben) und daraus hergestellte Erzeugnisse
  C: Eier und daraus hergestellte Erzeugnisse
  D: Fische und daraus hergestellte Erzeugnisse
  E: Erdnüsse und daraus hergestellte Erzeugnisse
  F: Sojabohnen und daraus hergestellte Erzeugnisse
  G: Milch und daraus hergestellte Erzeugnisse (einschließlich Laktose)
  H: Schalenfrüchte (Mandeln, Haselnüsse, Walnüsse, Cashewnüsse, Pecannüsse, Paranüsse, Pistazien, Macadamianüsse) und daraus hergestellte Erzeugnisse
  L: Sellerie und daraus hergestellte Erzeugnisse
  M: Senf und daraus hergestellte Erzeugnisse
  N: Sesamsamen und daraus hergestellte Erzeugnisse
  O: Schwefeldioxid und Sulfite in einer Konzentration von mehr als 10 mg/kg oder 10 mg/l (als SO₂)
  P: Lupinen und daraus hergestellte Erzeugnisse
  R: Weichtiere (z. B. Muscheln, Schnecken, Tintenfische) und daraus hergestellte Erzeugnisse

allergen_page:
  title: Allergene
  intro: "Restaurants in Österreich müssen über die 14 Hauptallergene informieren (Verordnung (EU) Nr. 1169/2011, Anhang II, und Allergeninformationsverordnung). Auf den Speiseplänen werden sie üblicherweise mit diesen Buchstaben gekennzeichnet:"
  letter: Kürzel
  allergen: Allergen
  note: Die Angaben stammen aus den Speiseplänen der Restaurants und werden automatisch ausgelesen. Lesefehler sind möglich, und Spuren durch Kreuzkontamination werden nicht angegeben – wenn du eine Allergie oder Unverträglichkeit hast, frag bitte direkt im Restaurant nach.
  diet_title: Vegetarisch und vegan
  diet_text: Als vegetarisch oder vegan gelten Gerichte, die das Restaurant ausdrücklich so kennzeichnet oder in einer entsprechenden Kategorie (z. B. „Menü Vegetarisch“) führt. Nicht gekennzeichnete Gerichte können trotzdem fleischlos sein, werden vom Filter aber ausgeblendet.

