allergen_info:
  A: Cereals containing gluten (wheat such as spelt and khorasan wheat, rye, barley, oats or their hybridised strains) and products thereof
  B: Crustaceans (e.g. prawns, lobster, crabs) and products thereof
  C: Eggs and products thereof
  D: Fish and products thereof
  E: Peanuts and products thereof
  F: Soybeans and products thereof
  G: Milk and products thereof (including lactose)
  H: Tree nuts (almonds, hazelnuts, walnuts, cashews, pecan nuts, Brazil nuts, pistachios, macadamia nuts) and products thereof
  L: Celery and products thereof
  M: Mustard and products thereof
  N: Sesame seeds and products thereof
  O: Sulphur dioxide and sulphites at concentrations of more than 10 mg/kg or 10 mg/l (as SO₂)
  P: Lupin and products thereof
  R: Molluscs (e.g. mussels, snails, squid) and products thereof

allergen_page:
  title: Allergens
  intro: "Restaurants in Austria have to inform about the 14 major allergens (Regulation (EU) No 1169/2011, Annex II, and the Austrian Allergen Information Regulation). On menus they are usually marked with these letters:"
  letter: Code
  allergen: Allergen
  note: The information comes from the restaurants' menus and is read automatically. Reading errors are possible and traces from cross-contamination are not listed – if you have an allergy or intolerance, please ask the restaurant directly.
  diet_title: Vegetarian and vegan
  diet_text: Dishes count as vegetarian or vegan if the restaurant marks them that way or lists them in a matching category (e.g. "Menü Vegetarisch"). Unmarked dishes may still be meat-free, but the filter hides them.

