privacy:
  title: Privacy policy
  sections:
    - heading: Controller
      text: "{owner}, {address}, {email}"
    - heading: Cookie
      text: "This website sets a single cookie named “lunchtime”. It only contains your favourites, your language choice, your display settings (color scheme, favourites or all restaurants, sort order, vegetarian/vegan filter) and whether you acknowledged the cookie notice. The cookie is technically necessary for the function you requested (§ 165 (3) TKG 2021), is not used for tracking and is not shared with third parties. It expires after 400 days or when you clear your browser's cookies."
    - heading: Location
      text: "If you choose “Nearby”, your browser asks for your location. Distances are calculated in your browser only; your location is never sent to the server. So it does not have to be determined again on every page, it is kept rounded (to about 100 m) in the browser's session storage and deleted when you close the tab."
    - heading: No accounts, no tracking
      text: There are no user accounts, no analytics or advertising services and no embedded third-party content (e.g. fonts or scripts). No data about your selection is stored on the server.
    - heading: Server logs and hosting
      text: "When you visit the website, the server processes technically necessary connection data (e.g. IP address, time, requested page) to deliver the website and protect it against abuse (Art. 6 (1) (f) GDPR). Traffic is routed through Cloudflare (Cloudflare, Inc., USA) acting as a processor; transfers to the USA are based on the EU-US Data Privacy Framework. Hosting: {hosting}."
    - heading: Your rights
      text: "You have the right to access, rectification, erasure, restriction, data portability and objection. You can lodge a complaint with the Austrian Data Protection Authority (www.dsb.gv.at). Contact: {email}"

