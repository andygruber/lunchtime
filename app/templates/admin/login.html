{% extends "base.html" %}
{% block title %}Admin-Login · {{ site.site_name }}{% endblock %}
{% block content %}
<section class="panel login">
  <h1>Admin</h1>
  {% if not enabled %}
    <p>Der Admin-Bereich ist deaktiviert. Setze <code>ADMIN_PASSWORD_HASH</code> (siehe README).</p>
  {% else %}
    {% if error %}<p class="flash">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">Passwort <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="btn btn-primary">Anmelden</button>
    </form>
  {% endif %}
</section>
{% endblock %}
